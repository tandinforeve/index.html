<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics E-Portfolio</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--surface:#fff;--text:#1b2433;--muted:#5d6b82;--accent:#3a4fd7;--accent2:#e8590c;--line:#dfe4ef;--soft:#eaeefc;--ok:#1f8f4e;--bad:#c9302c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#171e2e;--text:#e7ebf5;--muted:#93a0b8;--accent:#8c9bff;--accent2:#ff9a5c;--line:#26304a;--soft:#1f2842;--ok:#4cc982;--bad:#ff7b76;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--surface:#171e2e;--text:#e7ebf5;--muted:#93a0b8;--accent:#8c9bff;--accent2:#ff9a5c;--line:#26304a;--soft:#1f2842;--ok:#4cc982;--bad:#ff7b76;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:960px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-weight:700;color:var(--accent);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--text);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
nav button.on{background:var(--accent);color:var(--bg)}
main{max-width:960px;margin:auto;padding:24px 16px 60px}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:0 0 4px;line-height:1.2}h2{margin:24px 0 8px;font-size:1.2rem}
.sub{color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:1.8rem;font-weight:700;color:var(--accent)}
.hero{background:linear-gradient(135deg,var(--soft),var(--surface));border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}
.pri,.sec,.chip{font:inherit;font-size:14px;border-radius:10px;padding:8px 16px;cursor:pointer;border:1px solid var(--accent)}
.pri{background:var(--accent);color:var(--bg)}.sec{background:none;color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:99px;border-color:var(--line);background:var(--surface);color:var(--text);padding:6px 14px}.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:2px 16px}
summary{cursor:pointer;padding:10px 0;font-weight:600}
.tag{background:var(--soft);color:var(--accent);padding:1px 10px;border-radius:99px;font-size:12px;margin-left:8px}.tag.r{color:var(--accent2)}
.body{white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:12px;margin:0 0 12px}.body.r{border-color:var(--accent2)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}.opt.ok{border-color:var(--ok);background:var(--soft)}.opt.no{border-color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;width:100%;margin-bottom:8px;padding:10px;text-align:left;font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tile.sel{border-color:var(--accent);background:var(--soft)}.tile.ok{border-color:var(--ok);opacity:.6}
.meta{font-size:13px;color:var(--muted)}.bartrack{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bartrack i{display:block;height:100%;background:var(--accent)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">⚛ Physics</div><nav id="nav"></nav></div></header>
<main id="app"></main>
<script>
var D={"units": [{"n": 1, "name": "Photons and matter waves", "icon": "📐", "desc": "It will cover information regarding waves and particles."}, {"n": 2, "name": "Waves", "icon": "🌊", "desc": "Waves and oscillation"}, {"n": 3, "name": "Mechanics", "icon": "⚡", "desc": "Motion and the forces that influence it"}, {"n": 4, "name": "Optics", "icon": "🔭", "desc": "Polarization, diffraction and interference"}, {"n": 5, "name": "Electromagnetism", "icon": "🧲", "desc": "Magnetic fields and electromagnetic induction"}], "entries": [{"id": "emvuslfbchn985t", "unit": 1, "type": "note", "title": "De Broglie matter waves", "body": "A moving particle is associated with waves\nThese are matter waves"}, {"id": "emvuslyk2ia9r7r", "unit": 1, "type": "note", "title": "Double slit experiment", "body": "Shows wave-particle duality \nElectromagnetic waves contain electric and magnetic field"}, {"id": "emvusm9z511vgv2", "unit": 1, "type": "note", "title": "Heisenberg uncertainty principle", "body": "Impossible to measure the position and momentum of a particle simultaneously"}, {"id": "emvusn11tfzi8bg", "unit": 1, "type": "note", "title": "Einstein photoelectric equation", "body": "Conversion of light to electric current\nwork function is the minimum energy required to eject the electron from the metal surface"}, {"id": "emvusnha10i0ows", "unit": 1, "type": "note", "title": "Compton effect", "body": "Occurs due to change in wavelength where the x-ray collides with an electron and that scatters or recoil. This causes the compton shift.\n\nFrequency of the scattered photon is less than the incident ray.\nWavelength is just the opposite."}, {"id": "emvuso395475y1l", "unit": 1, "type": "note", "title": "Photo-electric effect", "body": "Intensity is directly proportional to photocurrent.\nConversion of light to electrical energy."}, {"id": "emvusoft0zuc328", "unit": 1, "type": "note", "title": "Stefan-Boltzmann law", "body": "Energy radiated per unit surface area of a blackbody is directly proportional to fourth power of its absolute temperature."}, {"id": "emvusorlbgy23et", "unit": 1, "type": "note", "title": "Black body radiation", "body": "A perfect absorber and emitter.\nDepends on temperature.\nDoes not depend on shape and chemical composition"}, {"id": "emvusppyi5dd35m", "unit": 1, "type": "reflection", "title": "Reflections on Wave-Particle Duality and Modern Physics", "body": "Studying Unit 1 helped me realize how classical physics fails to explain atomic-scale phenomena like blackbody radiation and the photoelectric effect. Understanding that light and moving particles exhibit both wave and particle characteristics was initially confusing, but breaking down key experiments—like the double-slit experiment and Compton scattering—helped bridge the gap. I still need to practice applying the formulas for Wien's displacement law and Heisenberg's uncertainty principle to numerical problems, but I feel much more confident about the core conceptual shifts in modern physics."}, {"id": "emvusqsznnwgksq", "unit": 2, "type": "note", "title": "Beats", "body": "Periodic variation in loudness or intensity of wave where two waves that have almost equal frequencies travel in the same direction and will superimpose."}, {"id": "emvusr5ok1dj1y9", "unit": 2, "type": "note", "title": "Power and intensity", "body": "Power is the energy carried by the wave per unit time\nIntensity is the energy carried by the wave per unit time"}, {"id": "emvusrk6q6vjqer", "unit": 2, "type": "note", "title": "Progressive wave", "body": "Continuous disturbance that moves through a medium, transferring energy and momentum from one place to another without permanently moving the matter itself"}, {"id": "emvuss3u30oxc76", "unit": 2, "type": "note", "title": "Simple harmonic motion", "body": "Motion of a string is along the vertical component and motion which is across the horizonal component is zero.\nGravitational forces are neglected\nrestoring force brings back the body to equilibrium"}, {"id": "emvussf5r0epde3", "unit": 2, "type": "note", "title": "Motions", "body": "Periodic motion repeats after regular interval:\nOscillatory and non-oscillatory."}, {"id": "emvusst9a77s0ec", "unit": 2, "type": "note", "title": "Waves", "body": "Oscillation is motion at a point\nwaves are oscillation occurring from one point to another"}, {"id": "emvusua7eqkujl3", "unit": 2, "type": "reflection", "title": "Reflection on Waves & Simple Harmonic Motion", "body": "In Unit 2, I developed a solid understanding of fundamental wave behaviors and oscillations. I learned how simple harmonic motion is driven by a restoring force that brings a body back toward equilibrium, and how energy and momentum transfer through progressive waves without permanently displacing the medium. I also explored key phenomena like wave interference and beats resulting from slightly differing frequencies.\n\nThe trickiest part of this unit was distinguishing clearly between energy transfer mechanisms, such as power versus intensity, as well as visualizing phase differences in SHM. To master these concepts, I drew comparison tables and worked through visual wave diagrams. Moving forward, I can apply these principles when studying sound synthesis, optics, and architectural acoustics."}, {"id": "emvut2s4s502hpx", "unit": 3, "type": "note", "title": "Kinematics", "body": "Deals with the study of motion without the effects of forces"}, {"id": "emvut9mh5i8nr16", "unit": 3, "type": "note", "title": "Three basic equation of kinematics", "body": "velocity equation\ndisplacement equation\nvelocity displacement"}, {"id": "emvut9xp9txlws8", "unit": 3, "type": "note", "title": "Reference frame and its types", "body": "Position and motion are relative\nA reference point is a well-defined coordinate system that describes the position and velocity of an object's particle\nInitial frame of reference: Newtons first law is applied\nNon-initial frame of reference: Newtons first law is not applied"}, {"id": "emvuta8hmp6o8hx", "unit": 3, "type": "note", "title": "Friction", "body": "A contact force that opposes motion.\nOrigin: roughness, intermolecular forces."}, {"id": "emvutakwmphhagq", "unit": 3, "type": "note", "title": "Laws of friction", "body": "Independent of the area of surface contact\nTangential to the area and opposes motion\nDirectly proportional to the normal reaction force"}, {"id": "emvutaymiycqiqb", "unit": 3, "type": "note", "title": "Angle of limiting friction", "body": "To obtain the equilibrium position:\nReaction force between the two objects\nHorizontal applied force\nForce due to weight/gravity"}, {"id": "emvutbad7as82ei", "unit": 3, "type": "note", "title": "Angle of repose", "body": "The maximum angle of inclination at which an object falls due to the weight of an object"}, {"id": "emvutbqpw5hvub6", "unit": 3, "type": "note", "title": "Air resistance", "body": "Type of frictional force exerted by air on the moving object"}, {"id": "emvutc192q8g09o", "unit": 3, "type": "note", "title": "Work-energy theorem", "body": "Work done by the force acting on an object is equal to the change in kinetic energy"}, {"id": "emvutcap1qngep3", "unit": 3, "type": "note", "title": "Newtons law in terms of momentum", "body": "The product of mass and velocity is momentum"}, {"id": "emvutcn5yr9mx9h", "unit": 3, "type": "note", "title": "The law of conservation of momentum", "body": "Assumption:\nFree from friction\nNot rotating\nMoves in only one direction"}, {"id": "emvutcxw6cjvx7i", "unit": 3, "type": "note", "title": "Impulse", "body": "Change in momentum"}, {"id": "emvutdcc3ickzwk", "unit": 3, "type": "note", "title": "Applications", "body": "Motion of gravity\nMotion of a spring-mass system\nMotion against friction"}, {"id": "emvutdsg6rzba2i", "unit": 3, "type": "reflection", "title": "Reflection on Mechanics", "body": "In this unit, I built a solid foundation in mechanics by exploring how and why objects move. I examined the core principles of kinematics, studied different types of friction (including the laws of friction and angle of repose), and understood the dynamics of reference frames. Furthermore, I dived into momentum, impulse, and the work-energy theorem, connecting theoretical laws like conservation of momentum to practical applications like spring-mass systems and motion against gravity.\n\nWhat was difficult?\n\nSome of the initial challenges involved distinguishing between inertial and non-inertial reference frames and visualizing the nuanced forces acting on an object at an angle of limiting friction. Working through complex problems involving impulse-momentum changes and energy conservation also required careful attention to detail and units.\n\nHow did I overcome it?\n\nI overcame these hurdles by breaking down each law into its core components, reviewing real-world applications, and organizing my notes systematically. Writing down precise definitions and revisiting the underlying equations helped clarify how different mechanical forces interact in a given system.\n\nWhere can I apply this knowledge?\n\nThis understanding of mechanics is essential not only for advanced physics problems but also for everyday engineering and motion analysis. Whether it is calculating forces in structural design, understanding vehicle safety dynamics (like airbags and momentum changes), or analyzing simple harmonic motion, these concepts provide a critical analytical framework for solving physical problems."}, {"id": "emvutetehuauwiu", "unit": 4, "type": "note", "title": "Polarization", "body": "Light travels in a single direction\nUnpolarized light will be polarized maximally at the angle of incidence\nThe tangent of polarization is equal to the refractive index of the denser medium"}, {"id": "emvutfsv8b8g482", "unit": 4, "type": "note", "title": "Diffraction", "body": "Bending of light\nThe distance between two consecutive elements is known as a grating element"}, {"id": "emvutgdhtjo0j45", "unit": 4, "type": "note", "title": "Interference", "body": "Constructive interference: When the amplitude of the two waves increases when interference takes place\nDestructive interference: When the amplitude of the two waves decreases when interference takes place"}, {"id": "emvutsha42t18nr", "unit": 4, "type": "note", "title": "LASER", "body": "Light Amplification Stimulated Emission Radiation\nMonochromatic\nIntense light at one spot\nUni-direction \nCoherent\ncollinated"}, {"id": "emvutss4rm28wck", "unit": 4, "type": "note", "title": "Types", "body": "stimulated absorption\nSpontaneous Emission\nStimulated Emission"}, {"id": "emvuubye5whus0m", "unit": 4, "type": "reflection", "title": "Reflection on Wave Optics & Lasers", "body": "In Unit 4, I explored the fascinating wave nature of light through polarization, diffraction, and interference. I learned how constructive and destructive interference alter wave amplitudes, and how the bending of light around obstacles creates diffraction patterns governed by grating elements. Additionally, I studied the principles behind lasers, focusing on stimulated emission and how light amplification produces monochromatic, coherent, and unidirectional beams. Finally, I examined polarization, understanding how unpolarized light becomes polarized and how Brewster's law connects the tangent of the polarization angle to the refractive index of a denser medium.\n\nThe most challenging part of this unit was visualizing how path differences in interference grating setups lead to specific diffraction maxima. To overcome this, I drew out ray diagrams and stepped through the derivations linking grating elements to wave angles. Moving forward, I can apply these optical principles to fields like fiber-optic communications, laser technology, and precision metrology."}, {"id": "emvuucn285zyeyu", "unit": 5, "type": "note", "title": "Magnetic field", "body": "Magnetic flux\n\nNo of magnetic field lines passing through an area"}, {"id": "emvuuf8tdanem4h", "unit": 5, "type": "note", "title": "Electromagnetic induction", "body": "The phenomenon of inducing EMF when there is a change in the magnetic flux"}, {"id": "emvuufgf1q7vk4m", "unit": 5, "type": "note", "title": "Faradays law of electromagnetc induction", "body": "Faraday's first law states that when there is a change in the magnetic field lines or flux, EMF will be induced and will exist as long as the change in magnetic flux exists.\nFaraday’s second law of electromagnetic induction states that the magnitude of the induced electromotive force (EMF) in a circuit is directly proportional to the rate of change of magnetic flux linked with that circuit"}, {"id": "emvuuftus40e2mn", "unit": 5, "type": "note", "title": "Methods to produce EMF", "body": "Change in magnetic field\nChange in area\nChange in orientation"}, {"id": "emvuug79gy1utqy", "unit": 5, "type": "note", "title": "Types of induction", "body": "Self-induction: self-induction is the process where a changing electric current induces an EMF in the same coil from\nMutual induction: the process where EMF in induced in the secondary coil due to the changing EMF in the first coil."}, {"id": "emvuugjkj1vmp8i", "unit": 5, "type": "note", "title": "Electromagnetic oscillation", "body": "The oscillation of electric and magnetic fields that propagate at the speed of light.\nFree oscillation: Oscillates at its own natural frequency without external factors"}, {"id": "emvuugutdfavtif", "unit": 5, "type": "note", "title": "LCR oscillation", "body": "The system oscillates at its own natural frequency without external factors\nDamped LCR oscillation: Amplitude gradually decreases with time."}]};
var QS=[
[1,"What is the minimum energy needed to eject an electron from a metal surface?",["Work function","Kinetic energy","Threshold intensity","Binding frequency"],0,"That minimum energy is called the work function."],
[1,"In the Compton effect, the scattered photon has…",["Lower frequency","Higher frequency","The same wavelength","Higher energy"],0,"The photon loses energy to the electron, so its frequency drops and its wavelength grows."],

[3,"Impulse equals…",["Change in momentum","Change in energy","Force × distance","Mass × velocity"],0,"Impulse = force × time = change in momentum."],
[3,"Momentum of a system is conserved when…",["No external force acts","Kinetic energy is conserved","Friction is present","Mass is constant"],0,"Only an external net force can change total momentum."],

var LSK='phys-portfolio-v2',S={profile:{},mine:[],best:{}};
try{var r=localStorage.getItem(LSK);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function best(k,v,low){var o=S.best[k];if(o==null||(low?v<o:v>o)){S.best[k]=v;save()}}
var TABS=[['about','About me'],['notes','My notes'],['quiz','Quiz'],['games','Games']];
var view='about',unit=1,q='',edit=false,adding=false,Z={s:0},G='menu',M,T;

function go(v){view=v;edit=false;G='menu';Z={s:0};try{history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
function about(){
  var p=S.profile,ent=all();
  if(edit)return `<h1>About me</h1><form id="pf" class="card"><label>My name<input name="name" value="${esc(p.name)}"></label><label>Class and school<input name="line" value="${esc(p.line)}"></label><label>Who I am<textarea name="who">${esc(p.who)}</textarea></label><label>Why I study physics<textarea name="why">${esc(p.why)}</textarea></label><label>My goals<textarea name="goals">${esc(p.goals)}</textarea></label><button class="pri">Save</button> <button type="button" class="sec" data-a="edit">Cancel</button></form>`;
  var sec=(t,v,d)=>`<div class="card"><b>${t}</b><p style="margin:6px 0 0;white-space:pre-wrap">${v?esc(v):'<span class="meta">'+d+'</span>'}</p></div>`;
  return `<div class="hero"><div class="meta">STUDENT E-PORTFOLIO</div><h1>${esc(p.name)||'Your Name'}</h1><p class="sub" style="margin:0">${esc(p.line)||'Your class and school'}</p><p><button class="sec" data-a="edit">Edit introduction</button></p></div>
  ${sec('Who I am',p.who,'Introduce yourself: your interests, strengths and what you enjoy outside class.')}${sec('Why I study physics',p.why,'What made you curious about physics?')}${sec('My goals',p.goals,'Where do you want your learning to take you?')}
  <h2>My progress</h2><div class="grid"><div class="card"><div class="big">${ent.length}</div>entries</div><div class="card"><div class="big">${ent.filter(e=>e.type=='reflection').length}</div>reflections</div><div class="card"><div class="big">${S.best.quiz!=null?S.best.quiz+'/5':'–'}</div>best quiz</div><div class="card"><div class="big">${S.best.tf||0}</div>best streak</div></div>
  <h2>Units</h2><div class="grid">${D.units.map(u=>`<div class="card" style="cursor:pointer" data-a="open" data-v="${u.n}"><div class="meta">${u.icon} UNIT ${u.n}</div><b>${esc(u.name)}</b><p class="meta" style="margin:4px 0 8px">${esc(u.desc)}</p><div class="bartrack"><i style="width:${Math.min(100,ent.filter(e=>e.unit==u.n).length*8)}%"></i></div></div>`).join('')}</div>`;
}
function notes(){
  var u=D.units[unit-1],list=all().filter(e=>e.unit==unit&&(!q||(e.title+e.body).toLowerCase().includes(q)));
  var h=`<h1>My notes</h1><p class="sub">Read, search and add your own entries.</p><div class="chips">${D.units.map(x=>`<button class="chip${x.n==unit?' on':''}" data-a="unit" data-v="${x.n}">${x.n} · ${esc(x.name)}</button>`).join('')}</div>
  <input id="q" type="search" placeholder="Search this unit" value="${esc(q)}" style="margin-bottom:12px"><p class="meta">${u.icon} ${esc(u.desc)}</p>`;
  h+=list.map(e=>`<details><summary>${esc(e.title)}<span class="tag${e.type=='reflection'?' r':''}">${esc(e.type)}</span></summary><div class="body${e.type=='reflection'?' r':''}">${esc(e.body)}</div>${e.mine?`<button class="del" data-a="del" data-v="${e.id}">Delete my entry</button>`:''}</details>`).join('')||'<div class="card meta">Nothing here yet.</div>';
  if(!all().some(e=>e.unit==unit&&e.type=='reflection'))h+='<div class="card meta">This unit has no reflection yet. Add one below: what was hard, what you learned, what to practise.</div>';
  return h+(adding?`<form id="nf" class="card"><label>Title<input name="title" required></label><label>Type<select name="type"><option>note</option><option>reflection</option><option>homework</option><option>classwork</option></select></label><label>Content<textarea name="body" required></textarea></label><button class="pri">Save entry</button> <button type="button" class="sec" data-a="add">Cancel</button></form>`:'<button class="pri" data-a="add">+ Add my own entry</button>');
}
function quiz(){
  if(!Z.qs)return `<h1>Quiz</h1><p class="sub">Five questions from your units. Pick a unit or mix them all.</p><div class="chips"><button class="chip" data-a="qs" data-v="0">All units</button>${D.units.map(x=>`<button class="chip" data-a="qs" data-v="${x.n}">Unit ${x.n}</button>`).join('')}</div>${S.best.quiz!=null?'<p class="meta">Best score: '+S.best.quiz+'/5</p>':''}`;
  if(Z.i>=Z.qs.length){best('quiz',Z.s);var m=Z.s==5?'Perfect score!':Z.s>=3?'Good work. Review the ones you missed.':'Keep practising. Re-read your notes and try again.';return `<div class="card"><h1>${Z.s} / ${Z.qs.length}</h1><p>${m}</p><button class="pri" data-a="quizreset">Play again</button></div>`}
  var x=Z.qs[Z.i];
  return `<p class="meta">Question ${Z.i+1} of ${Z.qs.length} · Score ${Z.s}</p><div class="card"><b>${esc(x[1])}</b>${x[2].map((o,i)=>`<button class="opt${Z.a!=null?(i==x[3]?' ok':i==Z.a?' no':''):''}" ${Z.a!=null?'disabled':''} data-a="pick" data-v="${i}">${esc(o)}</button>`).join('')}${Z.a!=null?`<p class="meta">${Z.a==x[3]?'Correct. ':'Not quite. '}${esc(x[4])}</p><button class="pri" data-a="next">Next</button>`:''}</div>`;
}
function games(){
  if(G=='menu')return `<h1>Games</h1><p class="sub">Practise your physics the fun way.</p><div class="grid"><div class="card" style="cursor:pointer" data-a="game" data-v="match"><h2 style="margin-top:0">🧩 Term Match</h2><p class="meta">Match 6 terms to their meanings. Fewer mistakes wins.${S.best.match!=null?' Best: '+S.best.match+' mistakes.':''}</p></div><div class="card" style="cursor:pointer" data-a="game" data-v="tf"><h2 style="margin-top:0">⚡ True or False</h2><p class="meta">Build the longest streak. One wrong answer ends it. Best: ${S.best.tf||0}.</p></div></div>`;
  var back='<p><button class="sec" data-a="menu">← All games</button></p>';
  if(G=='match'){
    if(M.done.length==6)return back+`<div class="card"><h2>All matched!</h2><p>Mistakes: ${M.miss}. Best: ${S.best.match}.</p><button class="pri" data-a="game" data-v="match">Play again</button></div>`;
    var col=(arr,k)=>arr.map(i=>{var d=M.done.includes(i);return `<button class="tile${d?' ok':''}${k=='t'&&M.sel===i?' sel':''}" ${d?'disabled':''} data-a="m${k}" data-v="${i}">${esc(M.p[i][k=='t'?0:1])}</button>`}).join('');
    return back+`<p class="meta">Tap a term, then its meaning. Mistakes: ${M.miss}</p><div class="two"><div>${col(M.t,'t')}</div><div>${col(M.d,'d')}</div></div>`;
  }
  if(T.over)return back+`<div class="card"><h2>${T.over==2?'You finished them all!':'Game over'}</h2><p>Streak: <b>${T.streak}</b> · Best: ${S.best.tf}</p>${T.why?'<p class="meta">'+T.why+'</p>':''}<button class="pri" data-a="game" data-v="tf">Play again</button></div>`;
  return back+`<p class="meta">Streak: ${T.streak}</p><div class="card"><h2 style="margin-top:0">${esc(T.q[T.i][0])}</h2><button class="pri" data-a="tf" data-v="1">True</button> <button class="sec" data-a="tf" data-v="0">False</button></div>`;
}
function render(){
  $('nav').innerHTML=TABS.map(t=>`<button class="${view==t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('');
  $('app').innerHTML=({about:about,notes:notes,quiz:quiz,games:games})[view]();
}
var A={
tab:v=>go(v),edit:()=>{edit=!edit;render()},open:v=>{unit=+v;go('notes')},unit:v=>{unit=+v;q='';render()},add:()=>{adding=!adding;render()},
del:v=>{if(confirm('Delete this entry?')){S.mine=S.mine.filter(e=>e.id!=v);save();render()}},
qs:v=>{var p=QS.filter(x=>!+v||x[0]==+v);Z={qs:shuf(p).slice(0,5),i:0,s:0,a:null};render()},
pick:v=>{Z.a=+v;if(Z.a==Z.qs[Z.i][3])Z.s++;render()},next:()=>{Z.i++;Z.a=null;render()},quizreset:()=>{Z={s:0};render()},
menu:()=>{G='menu';render()},
game:v=>{G=v;if(v=='match'){var p=shuf(PAIRS).slice(0,6),ix=p.map((x,i)=>i);M={p:p,t:shuf(ix),d:shuf(ix),sel:null,done:[],miss:0}}else T={q:shuf(TFS),i:0,streak:0,over:0};render()},
mt:v=>{M.sel=+v;render()},
md:v=>{if(M.sel==null)return;if(M.sel==+v){M.done.push(+v);if(M.done.length==6)best('match',M.miss,1)}else M.miss++;M.sel=null;render()},
tf:v=>{var s=T.q[T.i];if((v=='1')==!!s[1]){T.streak++;best('tf',T.streak);T.i++;if(T.i>=T.q.length)T.over=2}else{T.over=1;T.why='That statement was '+(s[1]?'true':'false')+': '+s[0]}render()}
};
$('app').onclick=e=>{var b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)};
$('app').oninput=e=>{if(e.target.id=='q'){q=e.target.value.trim().toLowerCase();var p=e.target.selectionStart;render();var i=$('q');i.focus();i.setSelectionRange(p,p)}};
$('app').onsubmit=e=>{e.preventDefault();var d=new FormData(e.target);
  if(e.target.id=='pf'){S.profile={name:d.get('name'),line:d.get('line'),who:d.get('who'),why:d.get('why'),goals:d.get('goals')};edit=false}
  else{S.mine.push({id:'u'+Date.now(),unit:unit,type:d.get('type'),title:d.get('title').trim(),body:d.get('body'),mine:1});adding=false}
  save();render()};
var h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]==h))view=h;
render();
</script>
</body>
</html>
